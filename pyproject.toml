[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prusa-workbench-mcp"
version = "0.1.0"
description = "MCP server + viewer for slicing with the PrusaSlicer CLI: one run per bed with its own settings, preview, send to the printer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "numpy",
    "scipy",          # convex hulls (lay flat)
    "trimesh>=4",
    "lxml",           # 3MF loading in trimesh
    "networkx",       # 3MF loading in trimesh
    "pillow>=11.3",   # thumbnails + previews (QOI)
    "rtree",          # ray casting (paint_supports small_gaps_mm)
    "send2trash; sys_platform != 'linux'",   # deleted jobs to the recycle bin (Linux uses gio)
    "pywebview; sys_platform != 'linux'",    # Prusa login window (Linux uses GTK + WebKit from the system)
]

[project.optional-dependencies]
dev = ["pytest", "manifold3d"]   # manifold3d: boolean ops for test parts

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
prusa-workbench-viewer = "prusa_workbench.viewer.__main__:main"
prusa-workbench-mcp = "prusa_workbench.mcp_server:main"

[tool.setuptools.packages.find]
include = ["prusa_workbench*"]

[tool.setuptools.package-data]
"prusa_workbench.viewer" = ["static/*"]
